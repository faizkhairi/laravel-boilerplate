version: 2

updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    # Majors held back on purpose. Drop an entry once its blocker clears.
    ignore:
      # PHPUnit 13 requires PHP 8.4.1; composer.json supports PHP ^8.3
      - dependency-name: phpunit/phpunit
        update-types: ["version-update:semver-major"]
    groups:
      composer-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      composer-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
