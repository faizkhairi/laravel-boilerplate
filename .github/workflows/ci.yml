name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: composer install --no-progress --no-interaction --prefer-dist
      - run: npm ci

      - name: PHP format check (Pint)
        run: vendor/bin/pint --test

      - name: Frontend lint (ESLint)
        run: npm run lint

      - name: No em dashes
        run: bash .github/scripts/check-dashes.sh

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - run: composer install --no-progress --no-interaction --prefer-dist

      - name: Static analysis (Larastan)
        run: composer analyse -- --no-progress --error-format=github

  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 8.3 is the composer.json floor; 8.4 is the target and runs coverage.
        php: ["8.3", "8.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, intl, zip
          coverage: ${{ matrix.php == '8.4' && 'pcov' || 'none' }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: composer install --no-progress --no-interaction --prefer-dist
      - name: Prepare .env
        run: cp .env.example .env && php artisan key:generate

      # Inertia pages render @vite tags, which need the build manifest.
      - name: Build assets
        run: npm ci && npm run build

      - name: Tests with coverage floor
        if: matrix.php == '8.4'
        run: composer test:coverage

      - name: Tests
        if: matrix.php != '8.4'
        run: php artisan test

  build:
    name: Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 is the engines floor; 24 is the .nvmrc target.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # app.js imports Ziggy from vendor/.
      - run: composer install --no-dev --no-progress --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Composer audit
        run: composer audit --locked

      - name: npm audit (high and critical)
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, mbstring, intl, zip
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: composer install --no-progress --no-interaction --prefer-dist
      - run: npm ci

      - name: Prepare app and SQLite database
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/e2e.sqlite
          DB_CONNECTION=sqlite DB_DATABASE=database/e2e.sqlite php artisan migrate --force

      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
